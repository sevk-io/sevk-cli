name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Check dependency lockfile
        shell: bash
        run: test -f bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version $package_version does not match tag $tag_version" >&2
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Package (Unix)
        if: matrix.target != 'win32-x64'
        run: |
          mkdir release
          cp dist/cli.js release/sevk
          cp LICENSE THIRD_PARTY_LICENSES.txt release/
          printf '{"type":"module"}\n' > release/package.json
          chmod +x release/sevk
          tar -czf sevk-${{ matrix.target }}.tar.gz -C release sevk LICENSE THIRD_PARTY_LICENSES.txt package.json

      - name: Package (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item dist/cli.js release/sevk.js
          Copy-Item LICENSE, THIRD_PARTY_LICENSES.txt release/
          Set-Content -Path release/sevk.cmd -Value '@node "%~dp0sevk.js" %*'
          Set-Content -Path release/package.json -Value '{"type":"module"}'
          Compress-Archive -Path release/sevk.js, release/sevk.cmd, release/LICENSE, release/THIRD_PARTY_LICENSES.txt, release/package.json -DestinationPath sevk-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sevk-${{ matrix.target }}
          path: sevk-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release checksums
        run: sha256sum sevk-*.tar.gz sevk-*.zip > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          files: |
            sevk-linux-x64.tar.gz
            sevk-linux-arm64.tar.gz
            sevk-darwin-arm64.tar.gz
            sevk-win32-x64.zip
            SHA256SUMS
          generate_release_notes: true
